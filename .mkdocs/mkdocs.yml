site_name: Agentic Coding 강의자료
site_url: https://karpjoo.github.io/agentic-coding/
repo_url: https://github.com/karpjoo/agentic-coding
docs_dir: ..                    # 한 단계 위 = 저장소 루트
site_dir: /tmp/mkdocs-site       # docs_dir 바깥의 임시 폴더 (빌드 결과물, 커밋 안 됨)

theme:
  name: material
  language: ko
  features:
    - navigation.tabs
    - navigation.sections
    - search.suggest

plugins:
  - search

exclude_docs: |
  .github/
  .mkdocs/

nav:
  - 소개: README.md
  - 용어집: GLOSSARY.md
  - "Part 1. 초인공지능 시대에 대한 전망":
      - 개요: part-1-agi-outlook/README.md
  - "Part 2. LLM과 자율":
      - 개요: part-2-llm-autonomy/README.md
  - "Part 3. Harness와 통제":
      - 개요: part-3-harness-control/README.md
  - "Part 4. Agentic SDLC":
      - 개요: part-4-agentic-sdlc/README.md
  - "Part 5. MACOW":
      - 개요: part-5-macow/README.md
  - "MACOW 도구": tools/macow/README.md
  